[env:esp32doit-devkit-v1]
platform = espressif32@^6.10.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.2
build_flags =
    -Wall
    -Wextra

[env:native]
platform = native@^1.2.1
test_framework = unity
test_build_src = no
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wpedantic
    -I include
